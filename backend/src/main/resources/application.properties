# Server
server.port=8080

# Database — use environment variables (never hard-code credentials)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/navadeep_portfolio?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# CORS — set your deployed frontend origin in production
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000}

# Error handling — do not expose stack traces
server.error.include-stacktrace=never
server.error.include-message=always
